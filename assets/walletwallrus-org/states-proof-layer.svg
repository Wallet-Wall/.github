<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="720" viewBox="0 0 1880 720" role="img" aria-labelledby="title desc">
  <title id="title">WalletWallrus-Org — States Proof Layer</title>
  <desc id="desc">A transparent-background WalletWall diagram. Proposed, canonical, and mirror states feed into the WalletWallrus-Org States Proof Layer. From there, proof either holds and permits proven progression to the next verified state, or the state moved and the request is refused.</desc>
  <defs>
    <style>
      text { font-family: Inter, Manrope, Sora, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #F7F1E8; }
      .subtitle { font-size: 16px; font-weight: 600; fill: #D2BFA9; }
      .smallcap { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; fill: #F7F1E8; }
      .boxTitle { font-size: 16px; font-weight: 700; fill: #4A342C; }
      .boxSub { font-size: 14px; font-weight: 600; fill: #7A4E3A; }
      .creamTitle { font-size: 16px; font-weight: 700; fill: #FAF6EF; }
      .creamSub { font-size: 14px; font-weight: 600; fill: #F9E7DA; }
      .railText { font-size: 13px; font-weight: 700; text-transform: uppercase; fill: #FAF6EF; }
      .footer { font-size: 15px; font-weight: 600; fill: #D2BFA9; }
      .stroke { stroke: #C58D60; stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; stroke-linecap: butt; stroke-linejoin: miter; }
      .box { stroke: #C58D60; stroke-width: 1; vector-effect: non-scaling-stroke; rx: 1; ry: 1; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#C58D60"/>
    </marker>
  </defs>

  <g transform="translate(74 40)">
    <image href="data:image/png;base64," x="0" y="0" width="84" height="84"/>
    <text class="title" x="108" y="32">WalletWallrus-Org</text>
    <text class="subtitle" x="108" y="58">States Proof Layer · Progression, proven. · Thick proof. Thin trust.</text>
  </g>

  <g transform="translate(90 170)">
    <text class="smallcap" x="0" y="0">Observed states</text>
    <g transform="translate(0 28)">
      <rect class="box" width="230" height="84" fill="#EFE7DB"/>
      <text class="boxTitle" x="115" y="32" text-anchor="middle">Proposed</text>
      <text class="boxSub" x="115" y="56" text-anchor="middle">PR · head</text>
    </g>
    <g transform="translate(0 148)">
      <rect class="box" width="230" height="84" fill="#EFE7DB"/>
      <text class="boxTitle" x="115" y="32" text-anchor="middle">Canonical</text>
      <text class="boxSub" x="115" y="56" text-anchor="middle">SHA · tree</text>
    </g>
    <g transform="translate(0 268)">
      <rect class="box" width="230" height="84" fill="#EFE7DB"/>
      <text class="boxTitle" x="115" y="32" text-anchor="middle">Mirror</text>
      <text class="boxSub" x="115" y="56" text-anchor="middle">SHA · tree</text>
    </g>
  </g>

  <g transform="translate(470 210)">
    <polygon class="box" fill="#C96F4A" points="180,0 360,180 180,360 0,180"/>
    <text class="creamTitle" x="180" y="136" text-anchor="middle" style="font-size:28px; font-weight:800;">States Proof</text>
    <text class="creamTitle" x="180" y="172" text-anchor="middle" style="font-size:28px; font-weight:800;">Layer</text>
    <text class="creamSub" x="180" y="214" text-anchor="middle">Authority · Hashes · Provenance</text>
    <text class="creamSub" x="180" y="238" text-anchor="middle">CI · Freshness · Permissions · Invariants</text>
  </g>

  <path class="stroke" d="M320 240H448" marker-end="url(#arrow)"/>
  <path class="stroke" d="M320 360H448" marker-end="url(#arrow)"/>
  <path class="stroke" d="M320 480H448" marker-end="url(#arrow)"/>

  <g transform="translate(920 178)">
    <rect class="box" width="164" height="34" fill="#5E5A60"/>
    <text class="railText" x="82" y="22" text-anchor="middle">Current proof</text>
  </g>
  <path class="stroke" d="M830 390C900 390 875 195 920 195" marker-end="url(#arrow)"/>

  <g transform="translate(1114 154)">
    <rect class="box" width="192" height="88" fill="#D77E58"/>
    <text class="creamTitle" x="96" y="35" text-anchor="middle">Proven progression</text>
    <text class="creamSub" x="96" y="60" text-anchor="middle">State may advance</text>
  </g>
  <path class="stroke" d="M1084 195H1114" marker-end="url(#arrow)"/>

  <g transform="translate(1414 154)">
    <rect class="box" width="234" height="88" fill="#EFE7DB"/>
    <text class="boxTitle" x="117" y="35" text-anchor="middle">Next verified state</text>
    <text class="boxSub" x="117" y="60" text-anchor="middle">Proof remains bound</text>
  </g>
  <path class="stroke" d="M1306 195H1414" marker-end="url(#arrow)"/>

  <g transform="translate(920 514)">
    <rect class="box" width="164" height="34" fill="#5E5A60"/>
    <text class="railText" x="82" y="22" text-anchor="middle">State moved</text>
  </g>
  <path class="stroke" d="M830 390C900 390 875 531 920 531" marker-end="url(#arrow)"/>

  <g transform="translate(1114 490)">
    <rect class="box" width="176" height="88" fill="#A78472"/>
    <text class="creamTitle" x="88" y="35" text-anchor="middle">Refuse</text>
    <text class="creamSub" x="88" y="60" text-anchor="middle">Proof invalidated</text>
  </g>
  <path class="stroke" d="M1084 531H1114" marker-end="url(#arrow)"/>

  <g transform="translate(90 654)">
    <text class="footer">Green on the wrong SHA is still wrong. Access is not authority. If reality moves, proof moves with it.</text>
  </g>
</svg>