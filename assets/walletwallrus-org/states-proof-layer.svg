<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="760" viewBox="0 0 1820 760" role="img" aria-labelledby="title desc">
  <title id="title">WalletWallrus-Org — States Proof Layer</title>
  <desc id="desc">Observed WalletWall states pass through the WalletWallrus-Org States Proof Layer. Authority, hashes, provenance, CI, freshness, permissions, and invariants are verified before progression.</desc>
  <defs>
    <style>
      :root {
        --bg:#FFFEF9;
        --terracotta:#C96F4A;
        --terracotta-hi:#D77E58;
        --beige:#EAD9C5;
        --cream:#F4E7DA;
        --mocha:#7A4E3A;
        --ink:#4A342C;
        --muted:#A97A62;
        --refuse:#B98C78;
      }
      text { font-family: Inter, Manrope, Sora, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title { font-size:32px; font-weight:800; letter-spacing:.01em; }
      .subtitle { font-size:17px; font-weight:600; }
      .label { font-size:18px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
      .body { font-size:16px; font-weight:600; }
      .small { font-size:15px; font-weight:600; }
      .tiny { font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
      .box { stroke:var(--mocha); stroke-width:1px; vector-effect:non-scaling-stroke; rx:1px; ry:1px; }
      .line { fill:none; stroke:#9A6A55; stroke-width:1px; vector-effect:non-scaling-stroke; stroke-linecap:butt; stroke-linejoin:miter; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#9A6A55"/>
    </marker>
    <pattern id="brickPattern" x="0" y="0" width="88" height="54" patternUnits="userSpaceOnUse">
      <rect width="88" height="54" fill="none"/>
      <path d="M0 27.5H88 M0 .5H88 M0 53.5H88 M44 0V27 M0 27V54 M88 27V54" stroke="#E6A485" stroke-opacity=".25" stroke-width="1" vector-effect="non-scaling-stroke" fill="none"/>
    </pattern>
  </defs>

  <rect width="1820" height="760" fill="#FFFEF9"/>

  <g transform="translate(72 46)">
    <text class="title" fill="#4A342C">WalletWallrus-Org</text>
    <text class="subtitle" y="34" fill="#7A4E3A">States Proof Layer · Progression, proven. · Thick proof. Thin trust.</text>
  </g>

  <g transform="translate(82 126)">
    <rect width="256" height="498" fill="#EAD9C5" class="box"/>
    <text class="label" x="24" y="34" fill="#7A4E3A">Observed states</text>

    <g transform="translate(24 68)">
      <rect width="208" height="96" fill="#FFFEF9" class="box"/>
      <text class="body" x="104" y="38" text-anchor="middle" fill="#4A342C">Proposed</text>
      <text class="small" x="104" y="62" text-anchor="middle" fill="#7A4E3A">PR · head</text>
    </g>

    <g transform="translate(24 196)">
      <rect width="208" height="96" fill="#FFFEF9" class="box"/>
      <text class="body" x="104" y="38" text-anchor="middle" fill="#4A342C">Canonical</text>
      <text class="small" x="104" y="62" text-anchor="middle" fill="#7A4E3A">SHA · tree</text>
    </g>

    <g transform="translate(24 324)">
      <rect width="208" height="96" fill="#FFFEF9" class="box"/>
      <text class="body" x="104" y="38" text-anchor="middle" fill="#4A342C">Mirror</text>
      <text class="small" x="104" y="62" text-anchor="middle" fill="#7A4E3A">SHA · tree</text>
    </g>

    <text class="tiny" x="24" y="462" fill="#A97A62">Incoming coordinates</text>
    <text class="small" x="24" y="486" fill="#7A4E3A">Each observed state is a candidate input.</text>
  </g>

  <g transform="translate(410 126)">
    <rect width="486" height="498" fill="#C96F4A" class="box"/>
    <rect width="486" height="498" fill="url(#brickPattern)" opacity=".36" rx="1" ry="1"/>

    <text class="title" x="243" y="48" text-anchor="middle" fill="#FFFEF9" style="font-size:28px">States Proof Layer</text>
    <text class="tiny" x="243" y="76" text-anchor="middle" fill="#F8DED2">Verification boundary between observed state and allowed change</text>

    <g transform="translate(34 112)">
      <rect width="418" height="96" fill="#F4E7DA" class="box"/>
      <text class="body" x="209" y="38" text-anchor="middle" fill="#4A342C">Authority · Hashes · Provenance</text>
      <text class="small" x="209" y="64" text-anchor="middle" fill="#7A4E3A">Who defines the state, what it is, and how it was measured.</text>
    </g>

    <g transform="translate(34 232)">
      <rect width="418" height="96" fill="#F4E7DA" class="box"/>
      <text class="body" x="209" y="38" text-anchor="middle" fill="#4A342C">CI · Freshness</text>
      <text class="small" x="209" y="64" text-anchor="middle" fill="#7A4E3A">Checks must be green for this exact state, not a prior one.</text>
    </g>

    <g transform="translate(34 352)">
      <rect width="418" height="96" fill="#F4E7DA" class="box"/>
      <text class="body" x="209" y="38" text-anchor="middle" fill="#4A342C">Permissions · Invariants</text>
      <text class="small" x="209" y="64" text-anchor="middle" fill="#7A4E3A">Progression must remain authorized, coherent, and within bounds.</text>
    </g>
  </g>

  <g class="line" marker-end="url(#arrow)">
    <path d="M338 242H390"/>
    <path d="M338 370H390"/>
    <path d="M338 498H390"/>
  </g>

  <path d="M896 375H932" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(932 296)">
    <rect width="166" height="132" fill="#F4E7DA" class="box"/>
    <text class="body" x="83" y="48" text-anchor="middle" fill="#4A342C">Proof</text>
    <text class="body" x="83" y="72" text-anchor="middle" fill="#4A342C">holds?</text>
    <text class="tiny" x="83" y="102" text-anchor="middle" fill="#A97A62">Current state only</text>
  </g>

  <path d="M1098 362C1118 362 1114 264 1134 264" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(1134 246)">
    <rect width="56" height="36" fill="#D77E58" class="box"/>
    <text class="small" x="28" y="24" text-anchor="middle" fill="#FFFEF9">YES</text>
  </g>
  <path d="M1190 264H1210" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(1210 206)">
    <rect width="236" height="108" fill="#D77E58" class="box"/>
    <text class="body" x="118" y="44" text-anchor="middle" fill="#FFFEF9">Proven progression</text>
    <text class="small" x="118" y="70" text-anchor="middle" fill="#F8DED2">Admissible state advancement</text>
  </g>

  <path d="M1446 260H1490" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(1490 206)">
    <rect width="208" height="108" fill="#FFFEF9" class="box"/>
    <text class="body" x="104" y="44" text-anchor="middle" fill="#4A342C">Next verified state</text>
    <text class="small" x="104" y="70" text-anchor="middle" fill="#7A4E3A">Bound to the same proof</text>
  </g>

  <path d="M1098 362C1116 362 1112 464 1134 464" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(1134 446)">
    <rect width="48" height="36" fill="#EAD9C5" class="box"/>
    <text class="small" x="24" y="24" text-anchor="middle" fill="#4A342C">NO</text>
  </g>
  <path d="M1182 464H1210" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(1210 404)">
    <rect width="220" height="108" fill="#B98C78" class="box"/>
    <text class="body" x="110" y="44" text-anchor="middle" fill="#FFFEF9">Refuse</text>
    <text class="small" x="110" y="70" text-anchor="middle" fill="#FFF3EA">State moved · proof invalidated</text>
  </g>

  <g transform="translate(82 678)">
    <text class="small" fill="#7A4E3A">Observed state is not assumed state. Access is not authority. No proof, no progression.</text>
  </g>
</svg>