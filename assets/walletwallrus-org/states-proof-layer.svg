<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">WalletWallrus — States Proof Layer</title>
<desc id="desc">Transparent WalletWall states proof diagram. Proposed, canonical, and mirror states enter WalletWallrus's States Proof Layer. Current proof permits progression to the next verified state; moved state is refused.</desc>
<defs>
<style>
text{font-family:Inter,Manrope,Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.h1{font-size:30px;font-weight:800;fill:#F7F1E8}
.tag{font-size:14px;font-weight:600;fill:#D4BDAE}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;fill:#F1E6DD}
.nodeTitle{font-size:15px;font-weight:760;fill:#4A342C}
.nodeSub{font-size:12px;font-weight:600;fill:#7A4E3A}
.heroTitle{font-size:24px;font-weight:800;fill:#FFF8F2}
.heroSub{font-size:11.5px;font-weight:650;fill:#F9E7DA}
.railText{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;fill:#FFF8F2}
.outTitle{font-size:14px;font-weight:750;fill:#FFF8F2}
.outSub{font-size:11.5px;font-weight:600;fill:#F9E7DA}
.endTitle{font-size:14px;font-weight:750;fill:#4A342C}
.endSub{font-size:11.5px;font-weight:600;fill:#7A4E3A}
.footer{font-size:12px;font-weight:600;fill:#D4BDAE}
.box{stroke:#C58D60;stroke-width:1px;vector-effect:non-scaling-stroke;rx:1;ry:1}
.line{fill:none;stroke:#C58D60;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:miter}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#C58D60"/></marker>
</defs>
<g transform="translate(44 24)">
  <image href="data:image/png;base64," x="0" y="0" width="70" height="70"/>
  <text class="h1" x="88" y="29">WalletWallrus</text>
  <text class="tag" x="88" y="52">States Proof Layer · Progression, proven. · Thick proof. Thin trust.</text>
</g>
<g transform="translate(44 132)">
  <text class="eyebrow" x="0" y="0">Observed states</text>
  <g transform="translate(0 22)"><rect class="box" width="180" height="62" fill="#EFE7DB"/><text class="nodeTitle" x="90" y="26" text-anchor="middle">Proposed</text><text class="nodeSub" x="90" y="45" text-anchor="middle">PR · head</text></g>
  <g transform="translate(0 100)"><rect class="box" width="180" height="62" fill="#EFE7DB"/><text class="nodeTitle" x="90" y="26" text-anchor="middle">Canonical</text><text class="nodeSub" x="90" y="45" text-anchor="middle">SHA · tree</text></g>
  <g transform="translate(0 178)"><rect class="box" width="180" height="62" fill="#EFE7DB"/><text class="nodeTitle" x="90" y="26" text-anchor="middle">Mirror</text><text class="nodeSub" x="90" y="45" text-anchor="middle">SHA · tree</text></g>
</g>
<path class="line" d="M224 185H340" marker-end="url(#arrow)"/>
<path class="line" d="M224 263H340" marker-end="url(#arrow)"/>
<path class="line" d="M224 341H340" marker-end="url(#arrow)"/>
<g transform="translate(355 143)">
  <polygon class="box" fill="#C96F4A" points="120,0 240,120 120,240 0,120"/>
  <text class="heroTitle" x="120" y="101" text-anchor="middle">States Proof</text>
  <text class="heroTitle" x="120" y="131" text-anchor="middle">Layer</text>
  <text class="heroSub" x="120" y="158" text-anchor="middle">Authority · Hashes · Provenance</text>
  <text class="heroSub" x="120" y="178" text-anchor="middle">CI · Freshness · Permissions · Invariants</text>
</g>
<path class="line" d="M595 263C655 263 645 183 684 183" marker-end="url(#arrow)"/>
<g transform="translate(684 169)"><rect class="box" width="132" height="28" fill="#5E5A60"/><text class="railText" x="66" y="18" text-anchor="middle">Current proof</text></g>
<path class="line" d="M816 183H842" marker-end="url(#arrow)"/>
<g transform="translate(842 151)"><rect class="box" width="164" height="64" fill="#D77E58"/><text class="outTitle" x="82" y="27" text-anchor="middle">Proven progression</text><text class="outSub" x="82" y="46" text-anchor="middle">State may advance</text></g>
<path class="line" d="M1006 183H1042" marker-end="url(#arrow)"/>
<g transform="translate(1042 151)"><rect class="box" width="182" height="64" fill="#EFE7DB"/><text class="endTitle" x="91" y="27" text-anchor="middle">Next verified state</text><text class="endSub" x="91" y="46" text-anchor="middle">Proof remains bound</text></g>
<path class="line" d="M595 263C655 263 645 343 684 343" marker-end="url(#arrow)"/>
<g transform="translate(684 329)"><rect class="box" width="132" height="28" fill="#5E5A60"/><text class="railText" x="66" y="18" text-anchor="middle">State moved</text></g>
<path class="line" d="M816 343H842" marker-end="url(#arrow)"/>
<g transform="translate(842 311)"><rect class="box" width="150" height="64" fill="#A78472"/><text class="outTitle" x="75" y="27" text-anchor="middle">Refuse</text><text class="outSub" x="75" y="46" text-anchor="middle">Proof invalidated</text></g>
<text class="footer" x="44" y="462">Green on the wrong SHA is still wrong. Access is not authority. If reality moves, proof moves with it.</text>
</svg>