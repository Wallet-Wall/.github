<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="557" viewBox="0 0 2048 557" role="img" aria-labelledby="title desc">
  <title id="title">WalletWallrus — States Proof Layer</title>
  <desc id="desc">Observed proposed, canonical, and mirror states enter the WalletWallrus States Proof Layer, which checks permissions, invariants, authority, hashes, provenance, CI, and freshness before allowing proven progression or refusing a moved state.</desc>
  <defs>
    <style>
      text{font-family:Inter,Manrope,Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .t{fill:#F7F1E8;font-weight:700}.d{fill:#4A342C;font-weight:700}.s{fill:#7A4E3A;font-weight:600}
      .box{stroke:#A86F50;stroke-width:1;vector-effect:non-scaling-stroke}.line{fill:none;stroke:#A86F50;stroke-width:1;vector-effect:non-scaling-stroke}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#A86F50"/></marker>
  </defs>

  <rect x="14" y="32" width="268" height="512" fill="#F1DFCA" class="box"/>
  <text x="148" y="59" text-anchor="middle" class="d" font-size="24">OBSERVED STATES</text>

  <g>
    <rect x="38" y="89" width="224" height="111" fill="#1E1B1A" class="box"/>
    <text x="150" y="137" text-anchor="middle" class="t" font-size="23">Proposed</text>
    <text x="150" y="166" text-anchor="middle" class="t" font-size="20" font-weight="500">PR · head</text>
  </g>
  <g>
    <rect x="34" y="250" width="228" height="108" fill="#1E1B1A" class="box"/>
    <text x="148" y="300" text-anchor="middle" class="t" font-size="23">Canonical</text>
    <text x="148" y="329" text-anchor="middle" class="t" font-size="20" font-weight="500">SHA · tree</text>
  </g>
  <g>
    <rect x="34" y="411" width="228" height="109" fill="#1E1B1A" class="box"/>
    <text x="148" y="461" text-anchor="middle" class="t" font-size="23">Mirror</text>
    <text x="148" y="490" text-anchor="middle" class="t" font-size="20" font-weight="500">SHA · tree</text>
  </g>

  <rect x="361" y="16" width="468" height="518" fill="#C96F4A" class="box"/>
  <text x="595" y="42" text-anchor="middle" class="t" font-size="27">WALLETWALLRUS</text>
  <text x="595" y="72" text-anchor="middle" class="t" font-size="27">STATES PROOF LAYER</text>

  <rect x="382" y="99" width="426" height="100" fill="#1E1B1A" class="box"/>
  <text x="595" y="158" text-anchor="middle" class="t" font-size="23">PERMISSIONS · INVARIANTS</text>

  <rect x="410" y="249" width="370" height="111" fill="#1E1B1A" class="box"/>
  <text x="595" y="299" text-anchor="middle" class="t" font-size="23">AUTHORITY · HASHES ·</text>
  <text x="595" y="328" text-anchor="middle" class="t" font-size="23">PROVENANCE</text>

  <rect x="452" y="411" width="286" height="100" fill="#1E1B1A" class="box"/>
  <text x="595" y="470" text-anchor="middle" class="t" font-size="23">CI · FRESHNESS</text>

  <path d="M262 144H350" class="line" marker-end="url(#a)"/>
  <path d="M262 304H319Q329 304 329 294V282Q329 273 340 273H350" class="line" marker-end="url(#a)"/>
  <path d="M262 465H319Q329 465 329 455V444Q329 435 340 435H350" class="line" marker-end="url(#a)"/>

  <path d="M829 304H882" class="line" marker-end="url(#a)"/>
  <rect x="895" y="219" width="208" height="109" rx="32" fill="#262424" class="box"/>
  <text x="999" y="264" text-anchor="middle" class="t" font-size="24">PROOF</text>
  <text x="999" y="294" text-anchor="middle" class="t" font-size="24">HOLDS?</text>

  <path d="M1103 273H1160" class="line" marker-end="url(#a)"/>
  <rect x="1170" y="205" width="162" height="102" fill="#1B1210" class="box"/>
  <text x="1251" y="264" text-anchor="middle" class="t" font-size="23">YES</text>
  <path d="M1332 256H1386" class="line" marker-end="url(#a)"/>
  <rect x="1398" y="199" width="281" height="112" fill="#201E1D" class="box"/>
  <text x="1538" y="247" text-anchor="middle" class="t" font-size="22">PROVEN</text>
  <text x="1538" y="277" text-anchor="middle" class="t" font-size="22">PROGRESSION</text>
  <path d="M1679 255H1733" class="line" marker-end="url(#a)"/>
  <rect x="1745" y="198" width="290" height="113" fill="#201E1D" class="box"/>
  <text x="1890" y="246" text-anchor="middle" class="t" font-size="22">NEXT</text>
  <text x="1890" y="277" text-anchor="middle" class="t" font-size="22">VERIFIED STATE</text>

  <path d="M1103 286H1123Q1138 286 1138 301V419Q1138 434 1153 434H1162" class="line" marker-end="url(#a)"/>
  <rect x="1172" y="383" width="158" height="101" fill="#1B1210" class="box"/>
  <text x="1251" y="442" text-anchor="middle" class="t" font-size="23">NO</text>
  <path d="M1330 433H1388" class="line" marker-end="url(#a)"/>
  <rect x="1398" y="378" width="278" height="111" fill="#201E1D" class="box"/>
  <text x="1537" y="426" text-anchor="middle" class="t" font-size="22">REFUSE</text>
  <text x="1537" y="456" text-anchor="middle" class="t" font-size="22">STATE MOVED</text>
</svg>